name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 3. Compilar
        run: mvn -B -DskipTests compile

      - name: 4. Pruebas unitarias (Surefire)
        run: mvn -B test

      - name: 5. Pruebas de integración (Failsafe)
        run: mvn -B failsafe:integration-test failsafe:verify

      - name: 6. Empaquetar
        run: mvn -B -DskipTests package

      - name: 7. Guardar el JAR
        uses: actions/upload-artifact@v4
        with:
          name: minishop-jar
          path: target/*.jar

  publicar:
    name: Publicar versión
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el JAR
        uses: actions/download-artifact@v4
        with:
          name: minishop-jar
          path: dist

      - name: Crear la Release
        uses: softprops/action-gh-release@v2
        with:
          name: MiniShop ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.jar